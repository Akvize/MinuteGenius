[project]
name = "minutegenius"
version = "0.1.0"
description = "Comptes-rendus de réunion intelligents à partir d'une simple vidéo : transcription, identification des locuteurs, contenu partagé à l'écran et rédaction structurée par IA."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akvize" },
]
keywords = ["meeting", "minutes", "transcription", "diarization", "whisperkit", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "openai",
    "pillow>=12.3.0",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/Akvize/MinuteGenius"
Issues = "https://github.com/Akvize/MinuteGenius/issues"

[project.scripts]
minutegenius = "minutegenius.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minutegenius"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Keep this to genuine bugs (unused imports/vars) and import order — this
# codebase wasn't written against ruff's full opinionated rule set, and a lot
# of the stricter checks (blind except, subprocess without check=, etc.) would
# require real refactors rather than a lint pass.
select = ["E", "F", "I", "W"]
# Long lines are mostly French-language LLM prompt literals, not code smell —
# rewrapping them would hurt readability more than it helps.
ignore = ["E501"]
